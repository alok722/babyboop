[package]
name = "babyboop"
version = "0.1.0"
edition = "2021"
description = "BabyBoop toddler keyboard game: Windows host (Win32 + WebView2)"
license = "MIT"
publish = false

[lib]
name = "babyboop_core"
path = "src/lib.rs"

[[bin]]
name = "BabyBoop"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
winresource = { version = "0.1", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
