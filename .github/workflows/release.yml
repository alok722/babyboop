name: Release

on:
  push:
    tags: ["v*"]

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version from tag
        run: echo "BABYBOOP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: apps/macos/build.sh --dmg
      - name: Check stamped version
        run: |
          got=$(plutil -extract CFBundleShortVersionString raw apps/macos/build/BabyBoop.app/Contents/Info.plist)
          test "$got" = "${BABYBOOP_VERSION%%-*}" || { echo "app says $got, tag says $BABYBOOP_VERSION"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: apps/macos/build/BabyBoop-macOS.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Version from tag
        shell: bash
        run: echo "BABYBOOP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: dotnet test apps/windows/BabyBoop.Tests
      - run: apps/windows/build.ps1 -Rid win-x64
        shell: pwsh
      - run: apps/windows/build.ps1 -Rid win-arm64
        shell: pwsh
      - name: Check stamped version
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem apps/windows/out/*.exe) {
            $got = $f.VersionInfo.ProductVersion -replace '\+.*$', ''
            if ($got -ne $env:BABYBOOP_VERSION) { throw "$($f.Name) says $got, tag says $env:BABYBOOP_VERSION" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: apps/windows/out/*.exe

  release:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "Release $GITHUB_REF_NAME" > notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "BabyBoop $GITHUB_REF_NAME" --notes-file notes.md \
            dist/BabyBoop-macOS.dmg dist/BabyBoop-Windows-x64.exe dist/BabyBoop-Windows-arm64.exe
