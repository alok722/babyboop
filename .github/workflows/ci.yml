name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: apps/macos/build.sh --dmg
      - run: test "$(lipo -archs apps/macos/build/BabyBoop.app/Contents/MacOS/BabyBoop)" = "x86_64 arm64"

  windows:
    runs-on: windows-latest
    env:
      BABYBOOP_VERSION: 0.0.1-ci  # proves build.ps1 stamps the version, as release.yml does from the tag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test apps/windows/BabyBoop.Tests
      - run: apps/windows/build.ps1 -Rid win-x64
        shell: pwsh
      - run: apps/windows/build.ps1 -Rid win-arm64
        shell: pwsh
      - name: Check stamped version
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem apps/windows/out/*.exe) {
            $got = $f.VersionInfo.ProductVersion -replace '\+.*$', ''
            if ($got -ne $env:BABYBOOP_VERSION) { throw "$($f.Name) says $got, expected $env:BABYBOOP_VERSION" }
          }
      - name: Report sizes
        shell: pwsh
        run: Get-ChildItem apps/windows/out/*.exe | ForEach-Object { "{0} {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test site/*.test.mjs
